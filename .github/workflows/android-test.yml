# Builds the Android app and tests it on a phone emulator in GitHub's cloud.
# Screenshots and a report are saved as "android-test-results" on the run page.
name: Android test
on: { workflow_dispatch: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q project.zip && mv Vending-Manager-Phone-Apps app
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - working-directory: app
        run: npm ci && npx cap sync android
      - working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tests/android-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-test-results, path: shots }
